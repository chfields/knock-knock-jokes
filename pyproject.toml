[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-knock-jokes"
version = "1.0.0"
description = "A small command-line knock-knock joke system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Knock Knock Jokes contributors"}]
dependencies = []

[project.scripts]
knockknock = "knockknock.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
