[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-knock-jokes"
version = "1.0.0"
description = "A small command-line knock-knock joke system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Knock Knock Jokes contributors"}]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9; python_version < '3.10'",
    "pytest>=9.0.3,<10; python_version >= '3.10'",
    "flask>=3.0,<4",
]
web = ["flask>=3.0,<4"]
lint = ["bandit[toml]>=1.8,<2", "pip-audit>=2.8,<3", "ruff>=0.11,<1"]

[project.scripts]
knockknock = "knockknock.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
