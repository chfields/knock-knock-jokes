name: Trigger wardby delivery agent

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  dispatch:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@knock-knock-delivery') || contains(github.event.issue.title, '@knock-knock-delivery'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@knock-knock-delivery')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@knock-knock-delivery'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Revision-in-place: if this comment landed on an existing PR, resolve
      # the wardby run that originally opened it (via the hidden
      # <!-- wardby:<runId> --> marker (legacy: <!-- reevo-run:<runId> -->) wardby writes into every PR
      # body it creates) so the task text can ask the delivery agent to
      # continue that PR/branch instead of always opening a new one.
      - name: Resolve prior wardby run for revision-in-place (if this is a PR comment)
        id: continuation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          NUMBER=""
          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            NUMBER="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "issue_comment" ] && [ "$ISSUE_IS_PR" = "true" ]; then
            NUMBER="$PR_NUMBER"
          fi
          RUN_ID=""
          if [ -n "$NUMBER" ]; then
            BODY="$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json body -q .body || true)"
            RUN_ID="$(printf '%s' "$BODY" | grep -oP '<!-- (?:wardby|reevo-run):\K[A-Za-z0-9_-]+(?= -->)' | head -n1 || true)"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "pr_number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Send task to wardby
        env:
          TASK: ${{ github.event_name == 'issues' && github.event.issue.body || github.event.comment.body }}
          PRIOR_RUN_ID: ${{ steps.continuation.outputs.run_id }}
          PR_NUMBER: ${{ steps.continuation.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -n "$PRIOR_RUN_ID" ]; then
            HINT="[This request is a follow-up on PR #$PR_NUMBER, originally opened by wardby run $PRIOR_RUN_ID. If you delegate, pass continuePriorRun set to exactly \"$PRIOR_RUN_ID\" so the same PR/branch is continued instead of opening a new one.]"$'\n\n'
          else
            HINT=""
          fi
          FULL_TASK="${HINT}${TASK}"
          curl -sf -X POST "https://app.wardby.com/webhooks/${{ vars.REEVO_WEBHOOK_ID }}" \
            -H "x-webhook-secret: ${{ secrets.REEVO_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$FULL_TASK" '{task:$t}')"
