{% extends "base.html" %}
{% block content %}
  <h1>{{ joke.name }}</h1>
  <ol>
    {% for line in lines %}<li>{{ line }}</li>{% endfor %}
  </ol>
  {% if rating_error %}<p role="alert">{{ rating_error }}</p>{% endif %}
  <form method="post" action="{{ url_for('rate_joke', joke_id=joke.id) }}">
    <label for="rating">Rate this joke (1–5)</label>
    <input id="rating" name="rating" type="number" min="1" max="5" required>
    <button type="submit">Submit rating</button>
  </form>
  {% if random_page %}<p><a href="{{ url_for('random_joke') }}">Another random joke</a></p>{% endif %}
{% endblock %}
